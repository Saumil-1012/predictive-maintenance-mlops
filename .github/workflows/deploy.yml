name: Predictive Maintenance CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Test the ML model and API
  # ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn scikit-learn pandas numpy joblib pydantic pytest httpx

      - name: Train model for testing
        run: python ml/train.py

      - name: Run API tests
        run: pytest tests/ -v

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker image
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pred-maint:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d -p 8000:8000 --name test-container pred-maint:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health
          docker stop test-container

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to AKS (runs when Azure is ready)
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        run: |
          echo "Azure deployment — activate when AKS is ready"
          echo "Commands that will run:"
          echo "  docker login predmaintacr.azurecr.io"
          echo "  docker push predmaintacr.azurecr.io/pred-maint:${{ github.sha }}"
          echo "  kubectl set image deployment/pred-maint model-server=predmaintacr.azurecr.io/pred-maint:${{ github.sha }}"